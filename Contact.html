<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./CSS/StyleContact.css">
  </head>
  <body>
    <!-- Start Contact-->
    <section class="ContactSection position-relative vh-100">
        <div class="container ContentSection">
            <div class="d-flex flex-column justify-content-center align-items-center">
                <p class="text-uppercase paraQus">Any Questions?</p>
                <h1 class="PleaseH1 font-monospace">Please Feel Free To<br><spam class="text-center position-relative">Contact Us</spam></h1>
            </div>
            <div class="row gap-5">
                <div class="col-12 col-lg-4 DivArea d-flex flex-column justify-content-center align-items-center gap-2">
                    <div class="DivLogo text-center text-white fs-2">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <p class="message">123 Street, New York, USA</p>
                </div>
                <div class="col-12 col-lg-4 DivArea d-flex flex-column justify-content-center align-items-center gap-2">
                    <div class="DivLogo text-center text-white fs-2">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <p class="message">+012 345 6789info@gmail.com</p>
                </div>
                <div class="col-12 col-lg-4 DivArea d-flex flex-column justify-content-center align-items-center gap-2">
                    <div class="DivLogo text-center text-white fs-2">
                        <i class="fa-solid fa-message"></i>
                    </div>
                    <p class="message">info@gmail.com</p>
                </div>
            </div>
        </div>
    </section>
    <!-- End Contact-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
