<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Doctor - Tabeb</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../CSS/StyleFindDoctor.css">
</head>

<body>

    <!-- Start NavBar -->
     <header>
        <div class="logo-icon">
            <div class="logo-box">
                <i class="fa-solid fa-stethoscope"></i>
            </div>
            <a href="../index.html" class="logo">TABEB</a>
        </div>

        <nav class="navigation">
            <a href="../index.html#home" class="active">Home</a>
            <a href="../index.html#about">About</a>
            <a href="../index.html#services">Specialties</a>
            <a href="../index.html#services">Services</a>
            <a href="./Contact.html">Contact</a>
        </nav>
             <button class="toggle-button" onclick="theme()"><i class="fa-solid fa-moon"></i></button>
        <div class="right-section">
            <div class="login-btn">
                <a href="./login.html">Sign In</a>
            </div>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fas fa-bars"></i>
            </div>
        </div>
       

    </header>
    
    <!-- End NavBar -->
     <!-- Start Search Section -->
    <section class="search-section">

        <div class="container">

            <div class="text-center mb-5">
                <p class="section-title">FIND A DOCTOR</p>

                <h1>Search For Your Doctor</h1>

                <p class="text-muted">
                    Search by doctor's name to find the right doctor for you.
                </p>
            </div>

            <div class="search-box mx-auto mb-5">
                <input type="search" id="doctorSearch" class="form-control" placeholder="Search doctor name..." autocomplete="off">
            </div>

            <div id="searchResults" class="row g-4"></div>

            <p id="noResults" class="text-center text-muted mt-4 d-none">
                No doctors found.
            </p>

        </div>

    </section>
     <!-- End Search Section -->
    <script src="../JavaScript/FindDoctor.js"></script>

</body>
</html>
