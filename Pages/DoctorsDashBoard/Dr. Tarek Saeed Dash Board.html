<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../CSS/styleDoctorDashBoard.css">
    <title>Monitoring</title>
</head>
<body>
    <div class="container">
    <!-- Header -->
    <header>
      <h1>🩺 Dr. Tarek Saeed Dashboard</h1>
    </header>

    <!-- Quick Stats -->
    <section class="stats-grid">
      <div class="stat-card">
        <h3>Total Patients Today</h3>
        <div class="number" id="totalPatientsCount">0</div>
      </div>
      <div class="stat-card waiting">
        <h3>Waiting</h3>
        <div class="number" id="waitingPatientsCount">0</div>
      </div>
      <div class="stat-card completed">
        <h3>Completed</h3>
        <div class="number" id="completedPatientsCount">0</div>
      </div>
    </section>

    <!-- Main Content -->
    <div class="main-grid">
      
      <!-- Add Patient Form -->
      <section class="card">
        <h2>Register New Patient</h2>
        <form id="patientForm">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-control" required placeholder="Example: Ahmed Mahmoud" />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" required placeholder="01XXXXXXXXX" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="age">Age</label>
              <input type="number" id="age" class="form-control" required min="1" max="120" placeholder="25" />
            </div>
            <div class="form-group">
              <label for="gender">Gender</label>
              <select id="gender" class="form-control" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="visitDate">Date and Time</label>
            <input type="text" id="visitDate" class="form-control" readonly />
          </div>

          <div class="form-group">
            <label for="notes">Diagnosis & Notes</label>
            <textarea id="notes" class="form-control" rows="3" placeholder="Patient symptoms or initial diagnosis..."></textarea>
          </div>

          <button type="submit" class="btn-submit">Add Patient to List</button>
        </form>
      </section>

      <!-- Patients List Table -->
      <section class="card">
        <h2>List of Registered Patients Today</h2>
        
        <div class="table-tools">
          <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search for a patient by name or phone number..." />
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Full Name</th>
                <th>Phone Number</th>
                <th>Date and Time</th>
                <th>Diagnosis & Notes</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="patientsTableBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
          <div id="emptyMessage" class="empty-msg" style="display: none;">No patients registered yet.</div>
        </div>
      </section>

    </div>
  </div>

  <script src="../../JavaScript/DoctorDashBoard.js"></script>
  
</body>
</html>
