<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/Patient monitoring.css">
    <title>Monitoring</title>
</head>
<body>

  <style>
      :root {
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --text-muted: #7f8c8d;
      --primary: #0077b6;
      --primary-hover: #023e8a;
      --accent: #00b4d8;
      --border-color: #e2e8f0;
      --danger: #e74c3c;
      --success: #2ecc71;
      --warning: #f39c12;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .theme-toggle {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle:hover {
      background: var(--primary);
      color: #fff;
    }

    /* Quick Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      border-right: 5px solid var(--primary);
    }

    .stat-card.completed {
      border-right-color: var(--success);
    }

    .stat-card.waiting {
      border-right-color: var(--warning);
    }

    .stat-card h3 {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .stat-card .number {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-color);
    }

     /* Table Section */
    .table-tools {
      margin-bottom: 15px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-color);
      color: var(--text-color);
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    th {
      background-color: var(--bg-color);
      color: var(--text-muted);
      font-weight: 600;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
    }

    .badge-waiting {
      background-color: rgba(243, 156, 18, 0.15);
      color: var(--warning);
    }

    .badge-completed {
      background-color: rgba(46, 204, 113, 0.15);
      color: var(--success);
    }

    .btn-delete {
      background: rgba(231, 76, 60, 0.15);
      color: var(--danger);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-delete:hover {
      background: var(--danger);
      color: white;
    }

    .empty-msg {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }

    /* تنسيق الأزرار داخل جدول العمليات (Actions) */
.btn-action {
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-right: 5px;
}

/* زر إكمال الحالة (Mark Completed) */
.btn-status {
  background-color: rgba(46, 204, 113, 0.15);
  color: #2ecc71;
}

.btn-status:hover {
  background-color: #2ecc71;
  color: white;
}


    

  </style>

    <div class="container">
    <!-- Header -->
    <header>
      <h1>🩺 Dr. Osama Sharif Dashboard</h1>
      <a href="../Pages/PatientRegister.html" class="btn-link">+ New Patient</a>
    </header>

    <!-- Quick Stats -->
    <section class="stats-grid">
      <div class="stat-card">
        <h3>Total Patients Today</h3>
        <div class="number" id="totalPatientsCount">0</div>
      </div>
      <div class="stat-card waiting">
        <h3>Waiting</h3>
        <div class="number" id="waitingPatientsCount">0</div>
      </div>
      <div class="stat-card completed">
        <h3>Completed</h3>
        <div class="number" id="completedPatientsCount">0</div>
      </div>
    </section>

    <!-- Main Content -->
    <div class="main-grid">

      <!-- Patients List Table -->
      <section class="card">
        <h2>List of Registered Patients Today</h2>

        <div class="table-tools">
          <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search for a patient by name or phone number..." />
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Full Name</th>
                <th>Phone Number</th>
                <th>Date and Time</th>
                <th>Diagnosis & Notes</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="patientsTableBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
          <div id="emptyMessage" class="empty-msg" style="display: none;">No patients registered yet.</div>
        </div>
      </section>

    </div>
  </div>

  <script src="../../Tabeb-Project/JavaScript/DoctorDashBoard.js"></script>
</body>
</html>
