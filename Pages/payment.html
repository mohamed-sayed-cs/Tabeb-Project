<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/payment.css">
  <title>Payment GateWay</title>
  
  <!-- Font Awesome Icons for the options section -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


</head>
<body>

  <!-- Checkout Form -->
  <div class="checkout-container">
    <form id="checkoutForm">
      <div class="form-wrapper">
        
        <!-- Billing Address Section -->
        <div class="col">
          <h3 class="col-title">Billing Address</h3>

          <div class="input-group">
            <label for="fullName">Full Name :</label>
            <input type="text" id="fullName" value="Sifat Akbar" placeholder="Enter full name" required>
          </div>

          <div class="input-group">
            <label for="email">Email :</label>
            <input type="email" id="email" value="sifat12" placeholder="Enter email" required>
          </div>

          <div class="input-group">
            <label for="address">Address :</label>
            <input type="text" id="address" placeholder="Enter address" required>
          </div>

          <div class="input-group">
            <label for="city">City :</label>
            <input type="text" id="city" placeholder="Enter city" required>
          </div>

          <div class="row-two">
            <div class="input-group">
              <label for="zipCode">Zip Code :</label>
              <input type="text" id="zipCode" placeholder="123 456" required>
            </div>
          </div>
        </div>

        <!-- Payment Section -->
        <div class="col">
          <h3 class="col-title">Payment</h3>

          <div class="input-group">
            <label>Cards Accepted :</label>
            <div class="cards-icons">
              <span class="card-badge instapay">Instapay</span>
              <span class="card-badge mastercard">MasterCard</span>
              <span class="card-badge meza">Meza</span>
              <span class="card-badge visa">VISA</span>
            </div>
          </div>

          <div class="input-group">
            <label for="cardName">Name On Card :</label>
            <input type="text" id="cardName" placeholder="Enter card name" required>
          </div>

          <div class="input-group">
            <label for="cardNumber">Credit Card Number :</label>
            <input type="text" id="cardNumber" placeholder="1111-2222-3333-4444" required>
          </div>

          <div class="input-group">
            <label for="expMonth">Exp Month :</label>
            <select id="expMonth" required>
              <option value="" disabled selected>Choose month</option>
              <option value="January">January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May">May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August">August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
          </div>

          <div class="row-two">
            <div class="input-group">
              <label for="expYear">Exp Year :</label>
              <select id="expYear" required>
                <option value="" disabled selected>Choose year</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
              </select>
            </div>
            <div class="input-group">
              <label for="cvv">CVV :</label>
              <input type="text" id="cvv" placeholder="1234" required>
            </div>
          </div>
        </div>

      </div>

      <button type="submit" class="checkout-btn">Proceed To Checkout</button>
    </form>
  </div>

  <!-- Flexible Payment Options Section -->
  <div class="options-container">
    <h2 class="title">Flexible Payment Options</h2>

    <div class="cards-grid">
      <!-- Card 1 -->
      <div class="card">
        <div>
          <i class="fa-regular fa-calendar-days"></i>
          <div class="card-title">Pay in Installments</div>
        </div>
        <div class="logos">
          <img src="../Tabeb-Project/Images/what-products-can-you-buy-through-ValU-Egypt.png" alt="valU" />
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <div>
          <i class="fa-regular fa-credit-card"></i>
          <div class="card-title">Credit & Debit Cards</div>
        </div>
        <div class="logos">
          <img src="../Tabeb-Project/Images/visa.png" alt="VISA" />
          <img src="../Tabeb-Project/Images/mastercard.webp" alt="Mastercard" />
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card">
        <div>
          <i class="fa-solid fa-mobile-screen-button"></i>
          <div class="card-title">Mobile Wallets & Instapay</div>
        </div>
        <div class="logos">
          <img src="../Tabeb-Project/Images/450da2d8d3db420bc8e8384fa06661de_screen.png" alt="Orange Cash" />
          <img src="../Tabeb-Project/Images/voda.jpg" alt="Vodafone Cash" />
          <img src="../Tabeb-Project/Images/images.png" alt="Instapay" />
          <img src="../Tabeb-Project/Images/we pay.jpg" alt="WE Pay" />
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('checkoutForm').addEventListener('submit', function(event) {
      event.preventDefault();
      alert('Form submitted successfully!');
    });
  </script>

</body>
</html>
